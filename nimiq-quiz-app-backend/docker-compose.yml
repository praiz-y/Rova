services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nimiq_quiz
      POSTGRES_PASSWORD: nimiq_quiz
      POSTGRES_DB: nimiq_quiz
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
